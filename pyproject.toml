[project]
name = "experiment-analyst-agent"
version = "0.1.0"
description = "Un agente analítico de experimentación A/B que recibe contexto de negocio, lee un dataset sencillo y genera hipótesis sobre diferencias entre tratamientos."
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.14"
dependencies = [
    "pandas (>=3.0.3,<4.0.0)",
    "ollama (>=0.6.2,<0.7.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "chromadb (>=1.0.12,<2.0.0)",
    "pypdf (>=6.4.0,<7.0.0)",
    "streamlit (>=1.51.0,<2.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "fastapi (>=0.115,<1.0)",
    "uvicorn[standard] (>=0.34,<1.0)",
    "sqlalchemy (>=2.0,<3.0)",
    "psycopg[binary] (>=3.2,<4.0)",
    "httpx (>=0.28,<1.0)",
    "plotly (>=6.0,<7.0)",
    "google-auth (>=2.40,<3.0)",
    "swagger-ui-bundle (>=1.1,<2.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ipykernel = "^7.2.0"
pytest = "^9.0.1"

