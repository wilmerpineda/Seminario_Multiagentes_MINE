[project]
name = "experiment-analyst-agent"
version = "0.1.0"
description = "Un agente analítico de experimentación A/B que recibe contexto de negocio, lee un dataset sencillo y genera hipótesis sobre diferencias entre tratamientos."
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas (>=3.0.3,<4.0.0)",
    "ollama (>=0.6.2,<0.7.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "rich (>=15.0.0,<16.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ipykernel = "^7.2.0"

