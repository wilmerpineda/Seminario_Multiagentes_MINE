steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "Dockerfile.session8.api", "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/session8-bi-api:${_TAG}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "Dockerfile.session8.dashboard", "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/session8-bi-dashboard:${_TAG}", "."]
images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/session8-bi-api:${_TAG}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/session8-bi-dashboard:${_TAG}"
substitutions:
  _REGION: us-central1
  _REPOSITORY: multiagent-course
  _TAG: latest
