<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Flujo del agente rag_course_assistant</title>
  <desc id="desc">Diagrama del flujo de indexacion y consulta del agente RAGCourseAssistant.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2f4858"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#1b2a34" flood-opacity="0.14"/>
    </filter>
    <style>
      .bg { fill: #f7f4ed; }
      .title { font: 700 34px Arial, sans-serif; fill: #22313a; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #51616b; }
      .lane-title { font: 700 20px Arial, sans-serif; fill: #22313a; }
      .label { font: 700 17px Arial, sans-serif; fill: #22313a; }
      .small { font: 400 14px Arial, sans-serif; fill: #445660; }
      .tiny { font: 400 12px Arial, sans-serif; fill: #5d6b73; }
      .box { rx: 12; ry: 12; filter: url(#shadow); stroke-width: 2; }
      .ingest { fill: #ffffff; stroke: #2f7d62; }
      .query { fill: #ffffff; stroke: #3d6fa3; }
      .store { fill: #fff7df; stroke: #b6862c; }
      .model { fill: #f0f5ff; stroke: #5876b7; }
      .response { fill: #eef8f2; stroke: #2f7d62; }
      .baseline { fill: #f8eff8; stroke: #9b5b95; }
      .lane { fill: none; stroke: #d8d1c2; stroke-width: 2; stroke-dasharray: 8 9; rx: 20; ry: 20; }
      .arrow { fill: none; stroke: #2f4858; stroke-width: 2.5; marker-end: url(#arrow); }
      .arrow-soft { fill: none; stroke: #7b8790; stroke-width: 2; marker-end: url(#arrow); stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="900"/>

  <text x="70" y="66" class="title">Flujo del agente rag_course_assistant</text>
  <text x="70" y="98" class="subtitle">RAGCourseAssistant carga documentos del curso, los indexa en ChromaDB y responde preguntas usando contexto recuperado con Ollama.</text>

  <rect x="50" y="135" width="1300" height="300" class="lane"/>
  <text x="75" y="170" class="lane-title">1. Preparacion e indexacion de conocimiento</text>

  <rect x="80" y="205" width="210" height="115" class="box ingest"/>
  <text x="105" y="240" class="label">Documentos fuente</text>
  <text x="105" y="267" class="small">Markdown: sesion4_rag.md</text>
  <text x="105" y="290" class="small">o carpeta business_case</text>

  <rect x="345" y="205" width="210" height="115" class="box ingest"/>
  <text x="370" y="240" class="label">Carga y normaliza</text>
  <text x="370" y="267" class="small">load_markdown_document()</text>
  <text x="370" y="290" class="small">load_pdf_document()</text>

  <rect x="610" y="205" width="220" height="115" class="box ingest"/>
  <text x="635" y="240" class="label">Divide en chunks</text>
  <text x="635" y="267" class="small">Markdown por secciones</text>
  <text x="635" y="290" class="small">PDF por pagina + overlap</text>

  <rect x="885" y="205" width="210" height="115" class="box ingest"/>
  <text x="910" y="240" class="label">Embeddings</text>
  <text x="910" y="267" class="small">OllamaEmbeddingFunction</text>
  <text x="910" y="290" class="small">nomic-embed-text</text>

  <rect x="1150" y="205" width="170" height="115" class="box store"/>
  <text x="1175" y="240" class="label">ChromaDB</text>
  <text x="1175" y="267" class="small">coleccion:</text>
  <text x="1175" y="290" class="small">sesion4_rag</text>

  <path class="arrow" d="M290 262 L345 262"/>
  <path class="arrow" d="M555 262 L610 262"/>
  <path class="arrow" d="M830 262 L885 262"/>
  <path class="arrow" d="M1095 262 L1150 262"/>

  <text x="610" y="370" class="tiny">index_course_content(reset=True) reconstruye la coleccion y guarda ids, texto, metadatos y embeddings.</text>

  <rect x="50" y="470" width="1300" height="350" class="lane"/>
  <text x="75" y="505" class="lane-title">2. Consulta RAG y generacion de respuesta</text>

  <rect x="80" y="545" width="180" height="105" class="box query"/>
  <text x="105" y="580" class="label">Pregunta</text>
  <text x="105" y="607" class="small">answer(question)</text>
  <text x="105" y="630" class="small">top_k = 4</text>

  <rect x="320" y="545" width="200" height="105" class="box query"/>
  <text x="345" y="580" class="label">Embedding query</text>
  <text x="345" y="607" class="small">Ollama embeddings</text>
  <text x="345" y="630" class="small">sobre la pregunta</text>

  <rect x="580" y="545" width="200" height="105" class="box store"/>
  <text x="605" y="580" class="label">Recuperacion</text>
  <text x="605" y="607" class="small">Chroma query()</text>
  <text x="605" y="630" class="small">RetrievedChunk</text>

  <rect x="840" y="545" width="210" height="105" class="box query"/>
  <text x="865" y="580" class="label">Prompt RAG</text>
  <text x="865" y="607" class="small">build_rag_prompt()</text>
  <text x="865" y="630" class="small">contexto + pregunta</text>

  <rect x="1110" y="545" width="190" height="105" class="box model"/>
  <text x="1135" y="580" class="label">LLM Ollama</text>
  <text x="1135" y="607" class="small">qwen2.5:3b</text>
  <text x="1135" y="630" class="small">SYSTEM_PROMPT</text>

  <rect x="840" y="700" width="210" height="85" class="box response"/>
  <text x="865" y="735" class="label">Respuesta final</text>
  <text x="865" y="762" class="small">contenido + modelo</text>
  <text x="865" y="782" class="small">+ chunks usados</text>

  <rect x="80" y="700" width="260" height="85" class="box baseline"/>
  <text x="105" y="735" class="label">Ruta comparativa</text>
  <text x="105" y="762" class="small">answer_without_rag()</text>
  <text x="105" y="782" class="small">sin recuperacion documental</text>

  <path class="arrow" d="M260 597 L320 597"/>
  <path class="arrow" d="M520 597 L580 597"/>
  <path class="arrow" d="M780 597 L840 597"/>
  <path class="arrow" d="M1050 597 L1110 597"/>
  <path class="arrow" d="M1205 650 C1205 730 1115 742 1050 742"/>
  <path class="arrow-soft" d="M680 545 C705 455 1015 410 1235 320"/>
  <path class="arrow-soft" d="M170 650 L170 700"/>

  <text x="605" y="675" class="tiny">Cada chunk aporta: chunk_id, fuente, seccion, texto, distancia y pagina si aplica.</text>
  <text x="370" y="742" class="tiny">La ruta baseline usa BASELINE_SYSTEM_PROMPT y pregunta directa al modelo.</text>

  <rect x="70" y="840" width="1260" height="1" fill="#d8d1c2"/>
  <text x="70" y="872" class="tiny">Archivos leidos: agent.py, chunker.py, document_loader.py, pdf_loader.py, prompts.py y vector_store.py.</text>
</svg>
